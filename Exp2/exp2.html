<body>
  <script>
    // Initialize jsPsych
    const jsPsych =
      initJsPsych({
        show_progress_bar: true,
        message_progress_bar: ""
      });

    const experiment_start_time = performance.now();

    const DATAPIPE_EXPERIMENT_ID = "0gKwd3GFsXG5";

    const subject_id =  jsPsych.randomization.randomID(10);
    if (!Array.isArray(window.EXP2_STIMULI)) {throw new Error("stims_exp2.js must define window.EXP2_STIMULI");}
    if (!Array.isArray(window.EXP2_FILLERS)) {throw new Error("stims_exp2.js must define window.EXP2_FILLERS");}
    if (window.EXP2_STIMULI.length !== 24) {throw new Error(`Expected 24 target lexical items, found ${window.EXP2_STIMULI.length}`);}
    if (window.EXP2_FILLERS.length !== 18) {throw new Error(`Expected 18 filler lexical items, found ${window.EXP2_FILLERS.length}`);}
    
    const target_item_numbers = window.EXP2_STIMULI.map(x => x.item);
      if (new Set(target_item_numbers).size !== target_item_numbers.length) {throw new Error("Duplicate target item numbers found in stims_exp2.js");}

    const filler_item_numbers = window.EXP2_FILLERS.map(x => x.item);
      if (new Set(filler_item_numbers).size !== filler_item_numbers.length) {throw new Error("Duplicate filler item numbers found in stims_exp2.js");}

    // 8 target lists × 2 button orders = 16 assignment cells
    const assignment_cell = Math.floor(Math.random() * 16);

    const list_number = (assignment_cell % 8) + 1;

    const response_buttons =
      assignment_cell < 8
        ? ["예", "아니오"]
        : ["아니오", "예"];

    jsPsych.data.addProperties({
      subject_id: subject_id,
      experiment: "Exp2",
      assignment_cell: assignment_cell,
      list_number: list_number,
      negation_design: "within",
      yes_no_order: response_buttons.join("|")
    });

    const timeline = [];

    const experimental_conditions = [
      {qp_position: "object",  context_condition: "ES", negation_form: "SFN"},
      {qp_position: "object",  context_condition: "ES", negation_form: "LFN"},
      {qp_position: "object",  context_condition: "EF", negation_form: "SFN"},
      {qp_position: "object",  context_condition: "EF", negation_form: "LFN"},
      {qp_position: "subject", context_condition: "ES", negation_form: "SFN"},
      {qp_position: "subject", context_condition: "ES", negation_form: "LFN"},
      {qp_position: "subject", context_condition: "EF", negation_form: "SFN"},
      {qp_position: "subject", context_condition: "EF", negation_form: "LFN"}
    ];
    function buildTarget(stim) {
      const base_condition = (stim.item - 1) % 8;
      const condition_index = (base_condition + (list_number - 1)) % 8;
      const condition = experimental_conditions[condition_index];
      const prefix = condition.qp_position;
      return {
        id: `T${stim.item}`,
        item: stim.item,
        lexical_set: stim.item,
        item_type: "target",
        qp_position: condition.qp_position,
        context_condition: condition.context_condition,
        negation_form: condition.negation_form,
        sentence_type: condition.negation_form,
        context_text: stim[`${prefix}_context`],
        first_event_text: stim[`${prefix}_${condition.context_condition}`],
        second_event_text: stim[`${prefix}_partial`],
        sentence: stim[`${prefix}_${condition.negation_form}`],
        correct_response: null,
        filler_type: null
      };
    }

    function getFillerType(stim) {
      if (stim.filler_type) {return stim.filler_type;}
      if (stim.item <= 6) {return "universal_affirmative";}
      if (stim.item <= 12) {return "negative";}
      return "neutral";
    }

   function buildFiller(stim) {
    const qp_position =
      ((stim.item - 1 + (list_number - 1)) % 2 === 0)
        ? "object"
        : "subject";

    const prefix = qp_position;
    const filler_type = getFillerType(stim);

    let sentence;
    let sentence_type;
    let filler_negation_form = null;

    if (filler_type === "negative") {
      filler_negation_form =
        ((stim.item - 7 + (list_number - 1)) % 2 === 0)
          ? "SFN"
          : "LFN";
      sentence = stim[`${prefix}_${filler_negation_form}`];
      sentence_type = filler_negation_form;
    } else {
      sentence = stim[`${prefix}_sentence`];
      sentence_type = filler_type;
    }
      return {
        id: `F${stim.item}`,
        item: stim.item,
        lexical_set: stim.item,
        item_type: "filler",
        qp_position: qp_position,
        context_condition: null,
        negation_form: filler_negation_form,
        sentence_type: sentence_type,
        context_text: stim[`${prefix}_context`],
        first_event_text: stim[`${prefix}_first_event`],
        second_event_text: stim[`${prefix}_second_event`],
        sentence: sentence,
        correct_response: stim.correct_response,
        filler_type: filler_type
      };
    } 
    const selected_targets = window.EXP2_STIMULI.map(buildTarget);
    const selected_fillers = window.EXP2_FILLERS.map(buildFiller);

    function wouldMakeThreeInARow(ordered, candidate, property) {
      if (ordered.length < 2) {return false;}
      const last = ordered[ordered.length - 1];
      const secondLast = ordered[ordered.length - 2];
      return (
        last[property] === candidate[property] &&
        secondLast[property] === candidate[property]
      );
    }

    function wouldMakeThreeInARow(ordered, candidate, property) {
      if (ordered.length < 2) {return false;}
      const last = ordered[ordered.length - 1];
      const secondLast = ordered[ordered.length - 2];
      return (
        last[property] === candidate[property] &&
        secondLast[property] === candidate[property]
      );
    }

function samePositionNegationAsPrevious(ordered, candidate) {
  if (ordered.length === 0) {
    return false;
  }

  const previous = ordered[ordered.length - 1];

  return (
    previous.qp_position === candidate.qp_position &&
    previous.negation_form === candidate.negation_form
  );
}

function makeConstrainedTargetOrder(targets) {
  function buildOrder(remaining, ordered) {
    if (remaining.length === 0) {return ordered;}
    const candidate_indices =
      jsPsych.randomization.shuffle(remaining.map((_, index) => index));
    for (const index of candidate_indices) {
      const candidate = remaining[index];
      const invalid =
        // 1. No consecutive identical position × negation
        samePositionNegationAsPrevious(ordered, candidate) ||
        // 2. No 3 identical positions in a row
        wouldMakeThreeInARow(ordered,candidate,"qp_position") ||
        // 3. No 3 identical negation forms in a row
        wouldMakeThreeInARow(ordered,candidate,"negation_form") ||
        // 4. No 3 identical contexts in a row
        wouldMakeThreeInARow(ordered,candidate,"context_condition");
      if (invalid) {continue;}
      const new_remaining = remaining.slice();
      new_remaining.splice(index, 1);
      const result = buildOrder(
        new_remaining,
        [...ordered, candidate]
      );
      if (result !== null) {return result;}
    }
    return null;
  }
  const result = buildOrder(targets.slice(), []);
  if (result === null) {
    throw new Error("Could not generate a valid target order.");
  }
  return result;
}

const randomized_targets = makeConstrainedTargetOrder(selected_targets);

const randomized_fillers = jsPsych.randomization.shuffle(selected_fillers);

// Put fillers into different gaps so fillers are never consecutive
const possible_gaps = Array.from(
  {length: randomized_targets.length + 1},
  (_, index) => index
);

const selected_gaps =
  jsPsych.randomization.sampleWithoutReplacement(
    possible_gaps,
    randomized_fillers.length
  );

const gap_fillers = {};

selected_gaps.forEach((gap, index) => {
  gap_fillers[gap] = randomized_fillers[index];
});

const experimental_items = [];

for (let i = 0; i <= randomized_targets.length; i++) {
  if (gap_fillers[i] !== undefined) {
    experimental_items.push(gap_fillers[i]);
  }

  if (i < randomized_targets.length) {
    experimental_items.push(randomized_targets[i]);
  }
}

// Debugging
console.table(
  experimental_items
    .filter(item => item.item_type === "target")
    .map((item, index) => ({
      target_order: index + 1,
      id: item.id,
      qp: item.qp_position,
      negation: item.negation_form,
      context: item.context_condition
    }))
);

    // Consent
    const consent = {
      type: jsPsychHtmlButtonResponse,
      record_data: false,
      stimulus: `
        <div class="consent">
          <h2 style="text-align:center;">
            연구 참여 안내 및 동의
          </h2>
          <h3 style="text-align:center;">
            언어 이해 및 해석에 관한 행동 연구
          </h3>
          <p style="text-align: center;">
            <strong>연구 개요</strong>
          </p>
          <p>
            본 연구는 사람들이 문장을 어떻게 이해하고 해석하는지 알아보기 위한 연구입니다. 연구에 참여하시면 짧은 상황 설명과 특정한 문장을 읽고, 관련된 질문에 답하게 됩니다.
            연구 참여는 자발적이며, 원하실 경우 언제든지 참여를 중단하실 수 있습니다. 연구에 참여하지 않거나 참여 도중 중단하더라도 어떠한 불이익도 없습니다.
          </p>
          </p>
          <p style="text-align: center;">
            <strong>소요 시간</strong>
          </p>
          <p>
            약 30분이 소요될 예정입니다.
          </p>
          <p style="text-align: center;">
            <strong>참여 보상</strong>
          </p>
          <p>
            연구 참여에 대한 보상으로 10,000원을 지급해 드립니다. 실험 종료 후, 보상 지급을 위해 계좌 정보 및 연락처를 수집할 예정입니다. 
            해당 정보는 보상 지급 이외의 용도로 사용되지 않으며, 목적 달성 후 즉시 폐기됩니다.
          </p>
          <p style="text-align: center;">
            <strong>개인정보 및 비밀유지</strong>
