      subject_id: subject_id,

      DEBUG_ITEM.stage3_image,

      DEBUG_ITEM.critical3_image,
      "ex/practice_umbrella_both_open.png",
      "ex/practice_umbrella_one_open.png",
      "ex/practice_police_opens_two_doors.png",
      "ex/practice_police_opens_one_of_two_windows.png",
      "ex/practice_cup_fill.png",
      "ex/practice_wine_fill.png",
      "ex/practice_mug_break.png",
      "ex/practice_dish_break.png"
    ];
    timeline.push({
      type: jsPsychPreload,
      images: image_files
    });


  

  function makeVisualStageTrial(item, image_key, sentence_key, stage_name) {
  return {
    type: jsPsychHtmlButtonResponse,
    save_trial_parameters: {stimulus: false},

    stimulus: `
      <div class="trial-card">
        <div class="context-block">
          <img
            class="experiment-image"
            src="${item[image_key]}"
          >

          <div class="target-box">
            <p class="target-sentence">
              ${item[sentence_key]}
            </p>
          </div>
        </div>
      </div>
    `,

    choices: ["다음"],

    css_classes: [
      "experiment-stage",
      "visual-stage",
      "sequence-stage"
    ],

    data: {
      item: item.item,
      trial_stage: stage_name,
      image: item[image_key],
      stage_sentence: item[sentence_key]
    }
  };
}


function makeVisualTargetTrial(item, negation_form) {
  const target_sentence = item[negation_form];

  return {
    type: jsPsychHtmlButtonResponse,
    save_trial_parameters: {stimulus: false},

    stimulus: `
      <div class="trial-card">
        <div class="context-block">

          <img
            class="experiment-image"
            src="${item.critical3_image}"
          >

          <div class="target-box">
            <p class="target-sentence">
              ${target_sentence}
            </p>
          </div>

          <p class="trial-question">
            주어진 상황에서 이 문장은 참인가요?
          </p>

        </div>
      </div>
    `,

    choices: response_buttons,

    css_classes: [
      "experiment-stage",
      "visual-stage",
      "judgment-stage"
    ],

    data: {
      item: item.item,
      item_type: "target",
      trial_stage: "judgment",
      negation_form: negation_form,
      sentence: target_sentence
    },

    on_finish: function(data) {
      const selected_label = response_buttons[data.response];

      data.response_label = selected_label;
      data.response_binary =
        selected_label === "예" ? "yes" : "no";
    }
  };
}

function addDebugVisualItem(item, negation_form) {

const stages = [

];

stages.forEach(([image_key, sentence_key, stage_name]) => {
  timeline.push(
    makeVisualStageTrial(
      item,
      image_key,
      sentence_key,
      stage_name
    )
  );
});

timeline.push(
  makeVisualTargetTrial(
    item,
    negation_form
  )
);
}
    const gap_fillers = {};
