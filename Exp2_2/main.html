  <body>
    <script>
    let totalItems = 0;
    const jsPsych = initJsPsych({show_progress_bar: true, auto_update_progress_bar: false,
      message_progress_bar: progress => `${Math.round(progress * totalItems)}/${totalItems}`});
    const experiment_start_time = performance.now();
    const DATAPIPE_EXPERIMENT_ID = "0gKwd3GFsXG5";
    const subject_id = jsPsych.randomization.randomID(10);

    if (!Array.isArray(window.EXP2_STIMULI) || window.EXP2_STIMULI.length === 0) {throw new Error("EXP2_STIMULI is missing or empty.");}

    // debugging: only PE
    // const RUN_TYPES = ["PE"];
    const RUN_TYPES = ["PE", "BASE"]

    // 2 fail lists × 2 negation lists × 2 button orders = 8
    const assignment_cell = Math.floor(Math.random() * 8);

    const list_number = (assignment_cell % 2) + 1;
    const response_order = Math.floor(assignment_cell / 2) % 2;
    const fail_list_number = Math.floor(assignment_cell / 4) + 1;

    const response_buttons =
      response_order === 0
        ? ["예", "아니오"]
        : ["아니오", "예"];

    // LFN / SFN
    function getNegationForm(index) {
      return (index + list_number - 1) % 2 === 0
        ? "LFN"
        : "SFN";
    }

    // Group fail1, fail2, fail3 versions by item
    const itemGroups = new Map();

    window.EXP2_STIMULI
      .filter(stim => RUN_TYPES.includes(stim.type))

    for (const type of RUN_TYPES) {
      const groups = [...itemGroups.values()]
        .filter(versions => versions[0].type === type)
        .sort((a, b) => {
          const aNum = Number(String(a[0].item).replace(/\D/g, ""));
          const bNum = Number(String(b[0].item).replace(/\D/g, ""));
          return aNum - bNum;
        });

      groups.forEach((versions, index) => {
        const selected_fail = (Math.floor(index / 2) + fail_list_number - 1) % 2 === 0 ? 2: 3;
        const stim = versions.find(version => version.fail === selected_fail);
        if (!stim) {throw new Error(`Missing fail${selected_fail} for ` + `${type} ${versions[0].item}`);}
        selected_items.push({...stim, negation_form: getNegationForm(index)});
      });
    }

    function shuffleNoThreeConsecutive(items) {
      const groups = new Map();

      // Group items by context type AND fail position
      for (const item of items) {
        const key = `${item.type}_${item.fail}`;

        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }

      const keys = [...groups.keys()];

      for (const key of keys) {
        groups.set(
          key,
          jsPsych.randomization.shuffle(groups.get(key))
        );
      }

      const result = [];
      const impossible = new Set();

      function arrange(lastType = null, lastFail = null, count = 0) {
        if (result.length === items.length) return true;

        const state = [
          ...keys.map(key => groups.get(key).length),
          lastType,
          lastFail,
          count
        ].join("|");

        if (impossible.has(state)) return false;

        const candidates = jsPsych.randomization.shuffle(
          keys.filter(key => {
            const group = groups.get(key);
            if (group.length === 0) return false;

            const next = group[group.length - 1];

            // Rule 1: No three consecutive PE or BASE
            if (next.type === lastType && count >= 2) {
              return false;
            }

            // Rule 2: Same context cannot repeat same fail
            if (
              next.type === lastType &&
              next.fail === lastFail
            ) {
              return false;
            }

            return true;
          })
        );

        for (const key of candidates) {
          const next = groups.get(key).pop();
          result.push(next);

          const nextCount =
            next.type === lastType ? count + 1 : 1;

          if (arrange(next.type, next.fail, nextCount)) {
            return true;
          }

          result.pop();
          groups.get(key).push(next);
        }

        impossible.add(state);
        return false;
      }

      if (!arrange()) {
        throw new Error(
          "Cannot arrange items with the current constraints."
        );
      }

      return result;
    }

    function getFillerKey(item, fillerType, answer) {
      // F1 is affirmative, so it has no LFN/SFN distinction.
      if (fillerType === "f1") {return `f1_${answer}`;}
      // F2/F3: use the same negation form as the target.
      const formKey = `${fillerType}_${item.negation_form}_${answer}`;
      if (typeof item[formKey] === "string") {return formKey;}
      // Allow affirmative F2 with a shared field name.
      if (fillerType === "f2") {const commonKey = `f2_${answer}`;
        if (typeof item[commonKey] === "string") {
          if (/않|(?:^|\s)안\s|못\s/.test(item[commonKey])) {throw new Error(`${item.item}: ${commonKey} is negative. ` + `Use ${formKey} instead.`);}

        }
      }
      throw new Error(`Missing filler: ${item.item}, fail${item.fail}, ${formKey}`);

          return {
            type: "filler",
            filler_type: fillerType,
            answer_condition: answer,
            negation_form:

            sentence: item[key],
            correct_response: item[`${key}_correct`]
          };

        }))
