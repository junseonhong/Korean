<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 3</title>

  <!-- Load JsPsych -->
  <script src="https://unpkg.com/jspsych@8.3.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  
  <!-- Load Stimuli -->
  <script src="stims_exp3.js"></script>
  <link href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" rel="stylesheet" type="text/css">
  
  <!-- Load Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --text-h: clamp(125px, 21dvh, 190px);
      --image-h: clamp(200px, 38dvh, 300px);
      --rating-h: 190px;
      --context-h: calc(var(--text-h) + var(--image-h) + 18px);
      --stimulus-h: calc(var(--context-h) + var(--rating-h) + 8px);
    }

    html { scrollbar-gutter: stable; }
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #f4f6f9;
      color: #333;
      font-family: 'Noto Sans KR', Arial, sans-serif;
    }

    .jspsych-display-element { min-height: 100dvh; justify-content: safe center; }
    h1, h2, h3 { color: #464545; }
    h2 { margin: 0 0 22px; font-size: 23px; text-align: center; }
    p { font-size: 18px; line-height: 1.6; }
    p, h1, h2, h3 { word-break: keep-all; overflow-wrap: break-word; }

    .jspsych-content-wrapper {
      width: calc(100% - 40px);
      max-width: 1000px;
      margin: 8px auto;
      padding: 12px 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,.1);
    }

    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 36px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,.08);
    }

    .jspsych-btn {
      margin: 5px 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #808080;
      color: white;
      font: 14px 'Noto Sans KR', sans-serif;
      cursor: pointer;
    }

    .jspsych-btn:hover { background: #666666; }
    .jspsych-btn:disabled { background: #b0b0b0; cursor: default; }

    #jspsych-html-button-response-btngroup {
      position: static;
      transform: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      min-height: 48px;
      margin: 0 auto;
    }

    /* Consent */

    .jspsych-content .consent p { font-size: 16px; line-height: 1.4; text-align: justify; }
    .jspsych-content .consent h3 { font-size: 18px; line-height: 1.4; }

    /* Instructions */

    .jspsych-content.instructions-stage { width: 100%; max-width: 100%; }

    .jspsych-content.instructions-stage .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      min-height: var(--stimulus-h);
      margin: 20px auto 0;
    }

    .inst-box { padding: 18px; background: lemonchiffon; border-radius: 12px; }
    .inst-box p { text-align: justify; }

    .jspsych-content.instructions-stage .jspsych-instructions-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 0;
      text-align: center;
    }

    /* Start screen */

    .jspsych-content.start-stage { width: 100%; max-width: 100%; }

    .jspsych-content.start-stage #jspsych-html-button-response-stimulus {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: var(--stimulus-h);
    }

    .jspsych-content.start-stage .trial-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0;
      text-align: center;
    }

    .jspsych-content.start-stage .begin-box {
      width: min(100%, 760px);
      padding: 30px;
      background: #e0f2fe;
      border-radius: 12px;
      text-align: center;
    }

    /* Experimental trials */

    .jspsych-content.norming-stage {
      position: static;
      width: 100%;
      max-width: 100%;
      height: auto;
      margin: auto !important;
    }

    .jspsych-content.norming-stage #jspsych-html-button-response-stimulus {
      width: 100%;
      height: var(--stimulus-h);
    }

    .jspsych-content.norming-stage main {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      height: var(--stimulus-h);
      margin: 0 auto;
      padding: 8px 12px 0;
      background: transparent;
      box-shadow: none;
    }

    .jspsych-content.norming-stage .context-display-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 0 0 var(--context-h);
      width: 100%;
      height: var(--context-h);
      margin: 0 auto;
      padding: 8px 12px;
      border: 1px solid #dbe3ea;
      border-radius: 12px;
    }

    .jspsych-content.norming-stage .context-text-container {
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      flex: 0 0 var(--text-h);
      width: 100%;
      height: var(--text-h);
      min-height: 0;
      margin: 0;
      padding: 8px 12px;
      overflow-y: auto;
      scrollbar-gutter: stable;
      background: #f8fafc;
      border-radius: 8px;
      text-align: justify;
    }

    .jspsych-content.norming-stage .context-text-line {
      margin: 3px 0;
      font-size: clamp(16px, 2.4dvh, 19px);
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .jspsych-content.norming-stage .hidden-text { visibility: hidden; }

    .jspsych-content.norming-stage .norming-image {
      display: block;
      flex: 0 0 var(--image-h);
      align-self: center;
      width: 100%;
      max-width: 600px;
      height: var(--image-h);
      min-height: 0;
      margin: 0 auto;
      object-fit: contain;
    }

    /* Rating screen */

    .jspsych-content.norming-rating-stage .time-intro {
      margin: 7px 0 3px;
      font-size: 18px;
      line-height: 1.3;
      text-align: center;
    }

    .jspsych-content.norming-rating-stage .question {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.35;
      text-align: center;
      word-break: keep-all;
    }

    /* Slider */

    .slider-wrap { width: 100%; max-width: 650px; margin: 0 auto; }
    .jspsych-content.norming-rating-stage .slider-wrap { flex: 0 0 auto; margin: auto; }

    .slider-wrap input[type="range"] {
      appearance: none;
      -webkit-appearance: none;
      display: block;
      width: 100%;
      height: 8px;
      margin: 18px 0;
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(to right,
        #808080 0%, #808080 var(--slider-progress, 0%),
        #e5e7eb var(--slider-progress, 0%), #e5e7eb 100%);
    }

    .slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid #808080;
      border-radius: 50%;
      background: white;
      box-shadow: 0 1px 3px rgba(0,0,0,.12);
      opacity: 0;
    }

    .slider-wrap input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      border: 2px solid #808080;
      border-radius: 50%;
      background: white;
      opacity: 0;
    }

    .slider-wrap.answered input[type="range"]::-webkit-slider-thumb {opacity: 1;}
    .slider-wrap.answered input[type="range"]::-moz-range-thumb {opacity: 1;}

    .slider-labels {
      display: flex;
      justify-content: space-between;
      color: #555;
      font-size: 13px;
    }

    /* Progress bar */

    #jspsych-progressbar-container {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin: 0;
      padding: 5px;
      background: #f8fafc;
    }

    #jspsych-progressbar-outer {
      order: 1;
      flex: 0 1 1300px;
      width: auto;
      height: 12px;
      margin: 0;
      background: #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    #jspsych-progressbar-inner {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #cbd5e1, #94a3b8 50%, #64748b);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.45);
      transition: width .4s ease;
    }

    #jspsych-progressbar-container > span {
      order: 2;
      min-width: 85px;
      font-size: 14px;
      font-weight: 500;
      text-align: right;
      white-space: nowrap;
    }

    /* Responsive layout */

    @media (max-height: 700px) {
      :root {
        --text-h: clamp(105px, 20dvh, 140px);
        --image-h: clamp(130px, 29dvh, 200px);
        --rating-h: 170px;
      }

      .jspsych-content-wrapper { margin: 4px auto; padding: 6px 20px 4px; }
      .jspsych-content.norming-stage .context-text-line { font-size: 16px; line-height: 1.35; }
      .jspsych-content.norming-rating-stage .time-intro { font-size: 17px; }
      .jspsych-content.norming-rating-stage .question { margin-bottom: 8px; font-size: 18px; }
    }

    @media (max-width: 768px) {
      .jspsych-content-wrapper {
        width: calc(100% - 12px);
        padding-left: 8px;
        padding-right: 8px;
      }

      .jspsych-btn { min-width: 92px; min-height: 44px; padding: 12px 18px; font-size: 16px; }
      .jspsych-content.norming-stage main { padding-left: 4px; padding-right: 4px; }
      .jspsych-content.norming-stage .context-display-box { padding-left: 6px; padding-right: 6px; }
    }

    @media (max-width: 600px) {
      :root { --rating-h: 220px; }
      .jspsych-content.norming-rating-stage .question { margin-bottom: 8px; font-size: 18px; }
    }

    @media (max-width: 600px) and (max-height: 700px) {
      :root { --rating-h: 205px; }
      .jspsych-content.norming-stage .context-text-line { font-size: 14px; line-height: 1.3; }
    }

    /* Mobile consent screen */
    @media (max-width: 768px) {
      .jspsych-display-element:has(.consent) {
        display: block !important;
        height: auto !important;
        min-height: 100dvh;
        padding-top: 12px;
        padding-bottom: 24px;
      }

      .jspsych-content-wrapper:has(.consent) {
        margin: 0 auto !important;
      }
    }

    /* Prevent progress bar from covering consent title */
    @media (max-width: 768px) {
      .jspsych-content .consent {
        padding-top: 45px !important;
      }
    }


    /* More room for text on mobile */
    @media (max-width: 600px) {
      :root {
        --text-h: clamp(200px, 35dvh, 260px);
        --image-h: clamp(110px, 23dvh, 180px);
      }

      .jspsych-content.norming-stage .context-text-line {
        font-size: 14px !important;
        line-height: 1.3 !important;
        margin: 2px 0 !important;
      }
    }


    /* Prevent double-tap zoom on mobile */
    html {
      touch-action: manipulation;
    }

    .jspsych-btn,
    button,
    input[type="range"] {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

  </style>

  </head>
  <body>
  <script>
    let totalItems = 1;
    let experimentCompleted = false;
    const LOCAL_DEBUG = false;
    const PAYMENT_FORM_URL = "https://stanforduniversity.qualtrics.com/jfe/form/SV_eqy8EZSNgFDqM3I";
    const jsPsych = initJsPsych({
      extensions: LOCAL_DEBUG ? [] : [
        {
          type: jsPsychExtensionPipe,
          params: {
            experiment_id: "SF89u8zNJw0i",
            filename: () => `Exp3_${subject_id}.csv`,
            stream: false,
            wait_message: `
              <p>실험 응답을 저장하고 있습니다.</p>
              <p>창을 닫지 말아 주세요.</p>
            `,
            on_save: function(result) {
              if (!experimentCompleted) return;
                const paymentURL = new URL(PAYMENT_FORM_URL);
                paymentURL.searchParams.set("subject_id", subject_id);
              jsPsych.getDisplayElement().innerHTML = `
                <main>
                  <h2>실험이 종료되었습니다.</h2>
                  <p>${result.ok
                    ? "실험 응답이 저장되었습니다."
                    : "응답 저장 중 문제가 발생했습니다. 참여자 ID를 보관하고 연구 담당자에게 연락해 주세요."
                  }</p>
                  <p>실험에 참여해 주셔서 감사합니다!</p>
                  <p>사례비 지급을 위해 아래 버튼을 클릭하여 정보를 입력해 주세요.</p>
                  <a href="${paymentURL.href}" class="jspsych-btn"
                    style="display:inline-block;text-decoration:none;">
                    정보 입력
                  </a>
                </main>
              `;
            }
          }
        }
      ],
      show_progress_bar: true,
      auto_update_progress_bar: false,
      message_progress_bar: progress =>
        `${Math.round(progress * totalItems)}/${totalItems}`
    });
    const experiment_start_time = performance.now();
    // const DATAPIPE_EXPERIMENT_ID = "0gKwd3GFsXG5"; // Kept for future deployment; not used in debug
    const subject_id = jsPsych.randomization.randomID(10);

    if (!Array.isArray(window.EXP3_STIMULI) || window.EXP3_STIMULI.length === 0) {throw new Error("stims_exp3.js must define window.EXP3_STIMULI.");}

    function getDeviceType() {
      const ua = navigator.userAgent;
      if (/iPad/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ||
          (/Android/i.test(ua) && !/Mobile/i.test(ua))) return "tablet";
      if (/iPhone|iPod|Android.*Mobile|Windows Phone|Mobi/i.test(ua)) return "mobile";
      return "computer";
    }

    jsPsych.data.addProperties({
      subject_id,
      experiment: "Exp3",
      device_type: getDeviceType()
    });

    // Context ends *before* the failure, so do not show critical2 for
    // fail2 or critical3 for fail3. Neutralize the sentence-final
    // "-지만," because it would reveal that a contrast is coming.
    function buildNormingContext(stim) {
      const background = stim.stage0_sentence;
      const priorSuccesses = [
        stim.stage1_sentence,
        stim.stage2_sentence,
        stim.stage3_sentence
      ].join(" ");
      const targetSuccesses = [
        stim.critical0_sentence.replace(/,\s*$/, ""),
        stim.critical1_sentence,
        ...(stim.fail === 3 ? [stim.critical2_sentence] : [])
      ];
      const lastIndex = targetSuccesses.length - 1;
      targetSuccesses[lastIndex] = targetSuccesses[lastIndex]
        .replace(/지만,?\s*$/, "다.")
        .replace(/,\s*$/, ".");
      return [background, priorSuccesses, targetSuccesses.join(" ")];
    }

    
    function buildNormingStages(stim) {
      const fail = Number(stim.fail);
      if (fail !== 2 && fail !== 3) {
        throw new Error(`Unsupported fail position for ${stim.item}: ${stim.fail}`);
      }
      const stageKeys = [
        "stage0", "stage1", "stage2", "stage3", "critical0", "critical1",
        ...(fail === 3 ? ["critical2"] : [])
      ];
      // Prepare the complete final text from the beginning
      const targetSentences = [
        stim.critical0_sentence.replace(/,\s*$/, ""),
        stim.critical1_sentence,
        ...(fail === 3 ? [stim.critical2_sentence] : [])
      ];
      const lastIndex = targetSentences.length - 1;
      targetSentences[lastIndex] = targetSentences[lastIndex]
        .replace(/지만,?\s*$/, "다.")
        .replace(/,\s*$/, ".");

      // Three lines, all occupying their final positions
      const lines = [
        [
          { text: stim.stage0_sentence, revealAt: 0 }
        ],
        [
          { text: stim.stage1_sentence, revealAt: 1 },
          { text: stim.stage2_sentence, revealAt: 2 },
          { text: stim.stage3_sentence, revealAt: 3 }
        ],
        targetSentences.map((text, i) => ({
          text,
          revealAt: i + 4
        }))
      ];

      return stageKeys.map((stageKey, stageIndex) => {
        const image = stim[`${stageKey}_image`];
        if (!image) {throw new Error(`Missing ${stageKey}_image for ${stim.item} fail${fail}`);}

        // Hidden sentences still occupy their final space
        const contextHTML = lines.map(parts => `
          <p class="context-text-line">
            ${parts.map(part => `
              <span class="${
                stageIndex >= part.revealAt ? "" : "hidden-text"
              }">${escapeHTML(part.text)}</span>
            `).join(" ")}
          </p>
        `).join("");
        return {
          stageKey,
          image,
          contextHTML
        };
      });
    }

    function escapeHTML(str) {
      return String(str).replace(/&/g, "&amp;")
        .replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    const timeline = [];

    //Balanced Randomization
    const selectedItems = [];
    for (const type of ["PE", "BASE"]) {
      // Group fail2 and fail3 by exact item ID
      const itemGroups = new Map();
      window.EXP3_STIMULI.filter(stim => stim.type === type).forEach(stim => {
          const itemId = String(stim.item);
          if (!itemGroups.has(itemId)) {itemGroups.set(itemId, []);}
          itemGroups.get(itemId).push(stim);
        });
      // Only use items with both fail2 and fail3
      const availableItems = [...itemGroups.entries()].filter(
        ([itemId, versions]) =>
          versions.some(v => Number(v.fail) === 2) &&
          versions.some(v => Number(v.fail) === 3)
      );
      if (availableItems.length < 8) {
        throw new Error(`Need at least 8 items for ${type}, but found ${availableItems.length}.`);
      }
      // Randomly choose 8 different items for this context type
      const chosenItems = jsPsych.randomization.shuffle(availableItems).slice(0, 8);
      // Assign fail2 to 4 items and fail3 to the other 4
      chosenItems.forEach(([itemId, versions], index) => {
        const selectedFail = index < 4 ? 2 : 3;
        const selectedVersion = versions.find(v => Number(v.fail) === selectedFail);
        selectedItems.push(selectedVersion);
      });
    }
    
    //Randomization
    function shuffleNoConsecutiveCondition(items) {
      let shuffled;
      let attempts = 0;
      let valid = false;
      while (!valid && attempts < 10000) {
        shuffled = jsPsych.randomization.shuffle([...items]);
        attempts++;
        valid = shuffled.every((item, index) => {
          if (index === 0) return true;
          const previous = shuffled[index - 1];
          // Rule 1: No identical context + fail consecutively
          if (item.type === previous.type &&Number(item.fail) === Number(previous.fail)) {
            return false;
          }
          // Rule 2: No 3 consecutive PE or BASE and fail2 or fail3
          if (index >= 2) {
            const twoBack = shuffled[index - 2];
            if (item.type === previous.type && item.type === twoBack.type) {
              return false;
            }
            if (Number(item.fail) === Number(previous.fail) &&
                Number(item.fail) === Number(twoBack.fail)) {
              return false;
            }
          }
          return true;
        });
      }
      if (!valid) {throw new Error("Could not find a valid randomization after 10000 attempts.");}
      return shuffled;
    }

    const experimental_items = shuffleNoConsecutiveCondition(selectedItems);
    const controlItems = jsPsych.randomization.shuffle(window.EXP3_CONTROLS);

    totalItems = experimental_items.length + controlItems.length;

    // Preload only the images that this participant will see.
    const normingStagesByItem = experimental_items.map(item => buildNormingStages(item));
    const imageFiles = [...new Set([
      ...normingStagesByItem.flatMap(stages => stages.map(stage => stage.image)),
      ...controlItems.flatMap(control => control.images)
    ])];

    timeline.push({
      type: jsPsychPreload,
      images: imageFiles,
      record_data: false
    });

     // Randomize control positions
    const controlPositions = [
      jsPsych.randomization.sampleWithoutReplacement([4, 5, 6], 1)[0],
      jsPsych.randomization.sampleWithoutReplacement([13, 14, 15], 1)[0]
    ];

    //Debug Table
    const DEBUG_MODE = false;
    let debugTrial = null;
    if (DEBUG_MODE) {
      const debugRows = [];
    let debugOrder = 0;
    let debugControlIndex = 0;
    experimental_items.forEach(item => {
      if (controlPositions.includes(debugOrder + 1)) {
        const control = controlItems[debugControlIndex++];
        debugRows.push({
          order: ++debugOrder,
          lexicalSet: "—",
          item: control.id,
          context: "CONTROL",
          fail: "—",
          condition: "CONTROL"
        });
      }
      debugRows.push({
        order: ++debugOrder,
        lexicalSet: String(item.item),
        item: item.item,
        context: item.type,
        fail: item.fail,
        condition: `${item.type}_fail${item.fail}`
      });
    });
      // Count items in each condition
      const conditionCounts = {
        PE_fail2: debugRows.filter(r => r.condition === "PE_fail2").length,
        PE_fail3: debugRows.filter(r => r.condition === "PE_fail3").length,
        BASE_fail2: debugRows.filter(r => r.condition === "BASE_fail2").length,
        BASE_fail3: debugRows.filter(r => r.condition === "BASE_fail3").length
      };
      // Check lexical-set duplication
      const lexicalSetIds = debugRows
  .filter(r => r.context !== "CONTROL")
  .map(r => r.lexicalSet);

      const noDuplicates = new Set(lexicalSetIds).size === lexicalSetIds.length;
      const balanced = Object.values(conditionCounts).every(n => n === 4);
      console.table(debugRows);
      console.log("Condition counts:", conditionCounts);
      console.log("No duplicate lexical sets:", noDuplicates);
      const tableRows = debugRows.map(row => `
        <tr>
          <td>${row.order}</td>
          <td>${row.lexicalSet}</td>
          <td>${row.item}</td>
          <td>${row.context}</td>
          <td>${row.context === "CONTROL" ? "—" : `fail${row.fail}`}</td>
          <td>${row.condition}</td>
        </tr>
      `).join("");
      debugTrial = {
        type: jsPsychHtmlButtonResponse,
        record_data: false,
        stimulus: `

    // Control trials: 7 visual stages + 1 rating stage
    function addControlItem(control, completedCount, targetTimeline = timeline, isPractice = false) {

        control.sentences.slice(4).map((text, i) => ({text, revealAt: i + 4}))

      const stages = control.images.map((image, stageIndex) => {
        if (!image) {throw new Error(`Missing control image: ${control.id}, stage ${stageIndex}`);}

              <span class="${stageIndex >= part.revealAt ? "" : "hidden-text"}">

    function downloadLocalCSV() {

      const blob =

      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `exp3_${subject_id}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }
